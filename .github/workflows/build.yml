name: Build

# Эпоха расширения: браузерный агент-пилот (extension/) без нативного приложения.
on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  extension-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JS syntax (content scripts)
        run: |
          for f in extension/opp.js extension/fsbridge.js extension/content.js extension/bg.js; do
            node --check "$f"
          done
      - name: Parser & memory tests
        run: node extension/test/parser.test.mjs
      - name: Shell host files sanity
        run: |
          LC_ALL=C grep -q '[^ -~]' shell/host.bat shell/install.bat shell/uninstall.bat shell/host.json && echo "non-ASCII in .bat/.json!" && exit 1 || true
          for f in shell/host.bat shell/install.bat shell/uninstall.bat; do
            LC_ALL=C grep -q '[^ -~]' "$f" && echo "non-ASCII in $f!" && exit 1 || true
          done
