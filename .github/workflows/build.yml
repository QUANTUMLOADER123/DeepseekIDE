name: Build

# Эпоха расширения: браузерный агент-пилот (extension/) без нативного приложения.
on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  extension-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JS syntax (content scripts)
        run: |
          for f in extension/opp.js extension/fsbridge.js extension/content.js extension/bg.js; do
            node --check "$f"
          done
      - name: Parser & memory tests
        run: node extension/test/parser.test.mjs
      - name: Shell host files sanity
        run: |
          # проверяем: в .bat/.json только ASCII (CRLF обязателен для Windows)
          for f in shell/install.bat shell/uninstall.bat shell/host.json; do
            if tr -d '\r\n' < "$f" | LC_ALL=C grep -q '[^ -~]'; then
              echo "non-ASCII in $f!"; exit 1
            fi
          done
